name: Publish Retype powered website to GitHub Pages
on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main  # 代码推送到 main 分支时自动触发

jobs:
  publish:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 授予写入代码库的权限

    steps:
      - uses: actions/checkout@v4  # 拉取当前代码库

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x  # Retype 依赖 .NET 7.0

      - name: Build Retype site
        uses: retypeapp/action-build@latest  # 构建静态网站（输出到 .retype 目录）

      - name: Deploy to GitHub Pages
        uses: retypeapp/action-github-pages@latest
        with:
          update-branch: true  # 自动更新部署分支（默认是 retype 分支）
