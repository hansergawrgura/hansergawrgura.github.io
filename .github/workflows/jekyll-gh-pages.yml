# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # 当推送到 "avartar" 分支时触发
  push:
    branches: ["avartar"]

  # 允许从 Actions 标签手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 限制并发部署，避免冲突（不取消正在进行的部署）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 配置 Pages 环境
        uses: actions/configure-pages@v5
      
      - name: 用 Jekyll 构建网站
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./  # Jekyll 源文件目录（默认根目录）
          destination: ./_site  # 构建输出目录（Jekyll 默认输出到 _site）
      
      - name: 上传构建产物作为 artifact
        uses: actions/upload-pages-artifact@v3
        # 默认会将 _site 目录的内容打包为名为 "github-pages" 的 artifact

  # 部署任务（依赖 build 任务成功完成）
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}  # 输出部署后的访问 URL
    runs-on: ubuntu-latest
    needs: build  # 确保 build 任务成功后才执行部署
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # 使用官方部署动作，默认读取 "github-pages" artifact
