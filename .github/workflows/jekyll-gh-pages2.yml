# 优化后的 Jekyll 部署工作流（增加调试和资源配置）
name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["avartar"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 增加资源配置，避免内存不足
    env:
      JEKYLL_ENV: production
      NOKOGIRI_USE_SYSTEM_LIBRARIES: true # 减少内存占用
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，避免构建时依赖历史提交信息出错

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll (with debug)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          jekyll_args: --verbose --trace # 增加详细日志和错误追踪
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
